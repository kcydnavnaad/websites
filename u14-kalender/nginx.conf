server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        add_header Content-Type "text/plain";
        return 200 "ok\n";
    }

    location = /feed {
        set $icloud_host "p147-caldav.icloud.com";
        proxy_pass https://$icloud_host/published/2/MTA0NzQyMjYxNTAxMDQ3NKgGFFnPaC3DjyRnKTXOPIVsNQoVeJsqiBPs_0ciz1bo7W3tsSaJvNS8RzLT-Nx9-ZvwF9nHnS_QPvqU4yiNnKY\;
        proxy_http_version 1.1;
        proxy_set_header Host $icloud_host;
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_set_header Accept "text/calendar,text/plain,*/*";
        proxy_ssl_server_name on;
        proxy_ssl_name $icloud_host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
        proxy_intercept_errors off;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=300" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css text/javascript application/javascript text/html;
}
