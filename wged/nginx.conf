server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Omgevingsbanner: leeg op prod, een balkje op dev (gezet door de helm-chart).
    sub_filter '</body>' '${DEV_BANNER_HTML}</body>';
    sub_filter_once on;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite hasht de bestandsnamen van assets, dus die mogen eeuwig gecachet.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
