# Rechtstreeks in conf.d, zonder envsubst-template: zo werkt het image ook met
# readOnlyRootFilesystem (de entrypoint kan dan niets naar conf.d schrijven).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Voor liveness- en readinessprobes
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite hasht de bestandsnamen van assets, dus die mogen eeuwig gecachet.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
